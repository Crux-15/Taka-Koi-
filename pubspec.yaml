name: tour_expense_tracker
description: "Taka Koi? Split and settle shared tour expenses with your group."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  google_sign_in: ^6.2.1

  # ── State Management (MVC with Provider) ─────────────────────────────────
  provider: ^6.1.2

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Location ──────────────────────────────────────────────────────────────
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # ── UI Components ─────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  cached_network_image_platform_interface: ^4.1.1   # web photo loading mode
  image_picker: ^1.1.2

  # ── Utilities ─────────────────────────────────────────────────────────────
  crypto: ^3.0.3
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  connectivity_plus: ^6.1.0
  url_launcher: ^6.3.3
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/taka_koi_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFD700"
  adaptive_icon_foreground: "assets/images/taka_koi_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/OFL.txt

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
    - family: WorkSans
      fonts:
        - asset: assets/fonts/WorkSans-Regular.ttf
        - asset: assets/fonts/WorkSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/WorkSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/WorkSans-Bold.ttf
          weight: 700
