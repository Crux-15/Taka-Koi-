name: tour_expense_tracker
description: "A premium tour expense tracking app for group travel."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ── Firebase ──────────────────────────────────────────────────────────────
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  google_sign_in: ^6.2.1

  # ── State Management (MVC with Provider) ─────────────────────────────────
  provider: ^6.1.2

  # ── Navigation ────────────────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Location ──────────────────────────────────────────────────────────────
  geolocator: ^13.0.1
  geocoding: ^3.0.0

  # ── UI Components ─────────────────────────────────────────────────────────
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  flutter_svg: ^2.0.10+1

  # ── Utilities ─────────────────────────────────────────────────────────────
  crypto: ^3.0.3
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  http: ^1.2.0
  connectivity_plus: ^6.1.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/taka_koi_icon.jpg"
  min_sdk_android: 21
  adaptive_icon_background: "#FFD700"
  adaptive_icon_foreground: "assets/images/taka_koi_icon.jpg"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
