<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by the value of `flutter build web --base-href`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Split trip expenses with friends, approve your own share, and settle up. Works offline.">
  <meta name="theme-color" content="#0B0A08">

  <!-- Home-screen app on iPhone: full screen, your logo, the app's name -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Taka Koi">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Taka Koi?</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #0B0A08; overscroll-behavior: none; }
    /* Shown until the app has drawn its first screen. */
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #B5AC97; transition: opacity .35s ease;
    }
    #boot img {
      width: 112px; height: 112px; border-radius: 28px;
      box-shadow: 0 16px 40px rgba(184, 134, 27, .35);
    }
    #boot .bar { width: 120px; height: 3px; border-radius: 3px; background: rgba(240,194,75,.15); overflow: hidden; }
    #boot .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #F0C24B; border-radius: 3px;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
    #boot.gone { opacity: 0; pointer-events: none; }
  </style>
  <script>
    // Read by the app (lib/utils/web_env_web.dart) to tell whether it was
    // opened from the home-screen icon or in a normal browser tab.
    window.takaKoiStandalone = function () {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        || window.navigator.standalone === true;
    };
  </script>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
  </div>
  <script>
    // Offline support: keeps the app's files on the phone so it opens
    // without internet (see web/sw.js).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (boot) { boot.classList.add('gone'); setTimeout(function () { boot.remove(); }, 400); }
      // Tell the offline worker which files this phone needed to start
      // (renderer, fonts, Firebase scripts) so they're kept too.
      if ('serviceWorker' in navigator && window.performance && performance.getEntriesByType) {
        navigator.serviceWorker.ready.then(function (reg) {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          if (reg.active) reg.active.postMessage({ type: 'keep', urls: urls });
        }).catch(function () {});
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
